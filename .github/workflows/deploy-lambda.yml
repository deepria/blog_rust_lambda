name: Deploy Rust Lambda

on:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/deploy-lambda.yml"

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-northeast-2
  LAMBDA_FUNCTION_NAME: testFunction

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Install Rust and Cargo Lambda
        uses: moonrepo/setup-rust@v1
        with:
          bins: cargo-lambda

      - name: Install Zig
        uses: mlugg/setup-zig@v1
        with:
          version: 0.14.0

      - name: Test
        run: cargo test --locked

      - name: Build Lambda
        run: cargo lambda build --release --arm64

      - name: Check Lambda artifact
        run: ls -la target/lambda/blog_rust_lambda

      - name: Deploy Lambda
        run: cargo lambda deploy ${{ env.LAMBDA_FUNCTION_NAME }} --binary-name blog_rust_lambda --description "${{ github.sha }}"
