name: Deploy Rust Lambda

on:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/deploy-lambda.yml"

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-northeast-2
  LAMBDA_FUNCTION_NAME: testFunction

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Install Rust and Cargo Lambda
        uses: moonrepo/setup-rust@v1
        with:
          bins: cargo-lambda

      - name: Install Zig
        uses: mlugg/setup-zig@v1
        with:
          version: 0.14.0

      - name: Test
        run: cargo test --locked

      - name: Determine Lambda architecture
        run: |
          ARCHITECTURE="$(aws lambda get-function-configuration \
            --function-name "${LAMBDA_FUNCTION_NAME}" \
            --query 'Architectures[0]' \
            --output text)"

          case "${ARCHITECTURE}" in
            arm64)
              echo "CARGO_LAMBDA_ARCH=--arm64" >> "${GITHUB_ENV}"
              ;;
            x86_64)
              echo "CARGO_LAMBDA_ARCH=--x86-64" >> "${GITHUB_ENV}"
              ;;
            *)
              echo "Unsupported Lambda architecture: ${ARCHITECTURE}" >&2
              exit 1
              ;;
          esac

      - name: Build Lambda
        run: cargo lambda build --release ${CARGO_LAMBDA_ARCH} --output-format zip

      - name: Check Lambda artifact
        run: |
          ls -la target/lambda/blog_rust_lambda
          unzip -l target/lambda/blog_rust_lambda/bootstrap.zip
          unzip -l target/lambda/blog_rust_lambda/bootstrap.zip | grep -q " bootstrap$"

      - name: Deploy Lambda
        run: |
          aws lambda update-function-code \
            --function-name "${LAMBDA_FUNCTION_NAME}" \
            --zip-file fileb://target/lambda/blog_rust_lambda/bootstrap.zip

          aws lambda wait function-updated \
            --function-name "${LAMBDA_FUNCTION_NAME}"

          aws lambda update-function-configuration \
            --function-name "${LAMBDA_FUNCTION_NAME}" \
            --description "${GITHUB_SHA}"
